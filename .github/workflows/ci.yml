name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  oracle:
    name: Incidente reproduz e o patch passa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Só o que o serviço de exemplo e os testes precisam (sem o CrewAI)
      - name: Instalar dependências do serviço
        run: pip install "fastapi>=0.115" "httpx>=0.27" "pydantic>=2.7" "pytest>=8"

      - name: O incidente reproduz no código original (3 falham, 1 passa)
        run: |
          set +e
          pytest -q tests > resultado.txt 2>&1
          cat resultado.txt
          grep -q "3 failed, 1 passed" resultado.txt

      - name: O patch gerado pela IA passa na suíte inteira
        run: |
          cp examples/app_corrigido.py src/app.py
          pytest -q tests

  agentes:
    name: Ferramentas dos agentes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - name: Sandbox de leitura de arquivos
        run: pytest -q tests_agents
